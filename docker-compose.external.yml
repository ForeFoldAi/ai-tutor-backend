# API + Redis only — use cloud Postgres from .env (no local db container).
#
#   ENV_FILE=/path/to/.env \
#   API_IMAGE=yourdockerhubuser/ai-tutor-backend:latest \
#   docker compose -f docker-compose.external.yml up -d
#
# .env must set DATABASE_URL to your cloud Postgres, e.g.:
#   DATABASE_URL=postgres://user:pass@host:5434/tutor

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ai-tutor-backend:latest}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Use DATABASE_URL from .env (cloud Postgres). Only override Redis to the Compose service.
      REDIS_URL: redis://redis:6379/0
      USE_MULTIMODAL_IMAGE_RETRIEVAL: "true"
      WARM_MULTIMODAL_ON_STARTUP: "true"
      PDF_EXTRACTION_PIPELINE_ENABLED: "true"
      PDF_EXTRACTION_MODELS_DIR: /app/models
      OCR_ENABLED: "true"
      ENABLE_VISUAL_INTENT_DETECTION: "true"
      ENABLE_STREAM_SAFE_INSERTION: "true"
      REQUIRED_TERM_GATE_ENABLED: "true"
      PDF_EXTRACTION_ENABLE_TABLE_VLM: "false"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - models_data:/app/models
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

volumes:
  uploads_data:
  chroma_data:
  models_data:
  hf_cache:
