name: Backend CI

on:
  push:
    paths:
      - "ai-tutor-backend/**"
  pull_request:
    paths:
      - "ai-tutor-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tutor-backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run core tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: dev-only-not-for-production-use-32chars
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/test_voice_session_profile.py \
            tests/test_voice_prosody.py \
            tests/test_voice_protection.py \
            tests/test_production_checks.py \
            tests/test_voice_prompts.py \
            tests/test_voice_chunking.py \
            -q --tb=short
