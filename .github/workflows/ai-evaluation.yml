name: AI Evaluation

on:
  pull_request:
    paths:
      - "app/**"
      - "evaluation/**"
      - "configs/**"
      - ".github/workflows/ai-evaluation.yml"
  workflow_dispatch:
    inputs:
      preset:
        description: "Eval preset (smoke|extraction|rag|teacher|full)"
        required: false
        default: "smoke"

jobs:
  metrics-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval deps
        run: |
          python -m pip install -U pip
          pip install pytest pytest-html pyyaml pillow numpy
      - name: Unit metrics (no ML/LLM)
        working-directory: evaluation
        run: pytest tests/test_metrics_unit.py -q

  smoke-eval:
    runs-on: ubuntu-latest
    needs: metrics-unit
    env:
      EVAL_SKIP_LLM: "true"
      EVAL_SKIP_HEAVY_ML: "true"
      EVAL_PRESET: ${{ github.event.inputs.preset || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + eval deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r evaluation/requirements-eval.txt
      - name: Run evaluation suite
        run: python evaluation/run_evaluation.py --preset "${EVAL_PRESET}" --skip-llm --skip-heavy-ml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-reports
          path: |
            evaluation/reports/
            evaluation/artifacts/

  full-eval:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.preset == 'full'
    runs-on: ubuntu-latest
    needs: smoke-eval
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt || true
          pip install -r evaluation/requirements-eval.txt
      - name: Full evaluation
        run: python evaluation/run_evaluation.py --preset full
      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-full-reports
          path: |
            evaluation/reports/
            evaluation/artifacts/
            evaluation/baselines/
