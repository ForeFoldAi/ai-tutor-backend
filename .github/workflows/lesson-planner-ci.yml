name: Lesson Planner CI

on:
  push:
    paths:
      - "ai-tutor-backend/app/modules/teacher/lesson_planner/**"
      - "ai-tutor-backend/app/services/lesson_planner/**"
      - "ai-tutor-backend/tests/**lesson_planner**"
      - "ai-tutor-backend/tests/factories/**"
  pull_request:
    paths:
      - "ai-tutor-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tutor-backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run lesson planner tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
        run: |
          pytest tests/test_lesson_planner.py tests/test_lesson_planner_phase2.py tests/test_lesson_planner_phase3.py tests/test_lesson_planner_api.py -q
