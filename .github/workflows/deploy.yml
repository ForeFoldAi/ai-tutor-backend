name: Deploy

on:
  pull_request:
    branches: [server]
  push:
    branches: [server]

env:
  IMAGE: ghcr.io/forefoldai/ai-tutor-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # These two tests only import app.core; full requirements.txt pulls llama.cpp / pyautogui and breaks CI.
      - run: pip install pytest pydantic python-dotenv
      - run: pytest tests/test_production_checks.py -q --tb=short
        env:
          PYTHONPATH: .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/server'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require Coolify secrets
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
        run: |
          test -n "$COOLIFY_URL" || { echo "Missing secret COOLIFY_URL"; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "Missing secret COOLIFY_TOKEN"; exit 1; }
          test -n "$COOLIFY_APP_UUID" || { echo "Missing secret COOLIFY_APP_UUID"; exit 1; }
          test -n "$COOLIFY_WORKER_UUID" || { echo "Missing secret COOLIFY_WORKER_UUID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy API, then worker
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
        run: |
          # Sequential on purpose: two image pulls/starts at once can spike KVM 4 memory.
          deploy_and_wait() {
            name="$1"; uuid="$2"
            echo "Deploying ${name}..."
            resp=$(curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"uuid\":\"${uuid}\",\"force\":false}")
            dep=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
            test -n "$dep" || { echo "No deployment id from Coolify: $resp"; exit 1; }
            # 60 x 15s = 15 min max per app
            for i in $(seq 1 60); do
              status=$(curl -fsS "${COOLIFY_URL}/api/v1/deployments/${dep}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json" \
                | jq -r '.status')
              echo "${name}: ${status}"
              case "$status" in
                finished) return 0 ;;
                failed|cancelled*) echo "${name} deployment ${status} - check Coolify logs"; exit 1 ;;
              esac
              sleep 15
            done
            echo "${name} deployment timed out"; exit 1
          }
          deploy_and_wait API "$COOLIFY_APP_UUID"
          deploy_and_wait Worker "$COOLIFY_WORKER_UUID"