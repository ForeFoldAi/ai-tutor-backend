[pytest]
testpaths = tests
pythonpath = ..
markers =
    eval: AI evaluation check
    critical: critical AI quality gate
    heavy_ml: requires PDF ML pipeline
    llm: requires LLM API
    pipeline: end-to-end pipeline
    retrieval: retrieval quality
    images: image extraction quality
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
