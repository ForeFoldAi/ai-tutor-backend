# Pull from Docker Hub — set API_IMAGE to your published image.
#
#   API_IMAGE=yourdockerhubuser/ai-tutor-backend:latest \
#   ENV_FILE=/path/to/.env \
#   docker compose up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_tutor
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID:-minioadmin} $${AWS_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-ai-tutor};
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ai-tutor}

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ${API_IMAGE:?Set API_IMAGE e.g. yourdockerhubuser/ai-tutor-backend:latest}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to your .env path e.g. /home/you/ai-tutor.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_tutor
      REDIS_URL: redis://redis:6379/0
      USE_MULTIMODAL_IMAGE_RETRIEVAL: "true"
      WARM_MULTIMODAL_ON_STARTUP: "true"
      PDF_EXTRACTION_PIPELINE_ENABLED: "true"
      PDF_EXTRACTION_MODELS_DIR: /app/models
      OCR_ENABLED: "true"
      ENABLE_VISUAL_INTENT_DETECTION: "true"
      ENABLE_STREAM_SAFE_INSERTION: "true"
      REQUIRED_TERM_GATE_ENABLED: "true"
      PDF_EXTRACTION_ENABLE_TABLE_VLM: "false"
      VOICE_WHISPER_ENABLED: "true"
      VOICE_SESSION_PROFILE: "true"
      VOICE_SESSION_REDIS: "true"
      VOICE_PROTECTION_PRELOAD: "true"
      CELERY_AUTOSTART: "false"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - models_data:/app/models
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

volumes:
  pg_data:
  uploads_data:
  chroma_data:
  models_data:
  hf_cache:
  minio_data:
  qdrant_data:
